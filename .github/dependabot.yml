version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "Npgsql.*", "EFCore.*"]
      testing:
        patterns: ["xunit*", "Testcontainers*", "coverlet*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
